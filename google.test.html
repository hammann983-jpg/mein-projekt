TERMIN_CONFIG.CLIENT_ID="test.apps.googleusercontent.com";

window.google={accounts:{oauth2:{initTokenClient:o=>({requestAccessToken:()=>setTimeout(()=>o.callback({access_token:"TEST",expires_in:3600}),10)}),revoke:()=>{}}}};

window.fetch=(url,opt={})=>{url=String(url);__calls.push((opt.method||"GET")+" "+url.replace("https://www.googleapis.com/",""));

 if(opt.method==="PATCH"&&/\\/events\\//.test(url)){(window.__patches=window.__patches||[]).push({url:url.split("/events/")[1],body:JSON.parse(opt.body)});return json({})}

 let m=url.match(/\\/calendars\\/([^/]+)\\/events/);if(m){const id=decodeURIComponent(m[1]);return json({items:DATA[id==="test-alicia@example.com"?"primary":id]||[]})}

  const END="<\/script>";
  h=h.replace('<script src="https://accounts.google.com/gsi/client" async defer>'+END,'').replace('<script src="google.js">'+END,STUB+'<script src="google.js">'+END);
